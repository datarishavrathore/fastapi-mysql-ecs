name: Deploy to ECS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".aws/**"
      - ".github/workflows/deploy.yml"

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fastapi-apis-registry
  ECS_CLUSTER: fastapi-server-cluster
  ECS_SERVICE: fastapi-api-task-service-tcmwwnc0
  CONTAINER_NAME: api-container
  TASK_DEFINITION: .aws/task-definition.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - id: build
        working-directory: backend
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG
          echo "image=$REGISTRY/$ECR_REPOSITORY:$TAG" >> $GITHUB_OUTPUT

      - name: Inject password into task definition
        run: |
          jq --arg p "${{ secrets.MYSQL_PASSWORD }}" \
            '(.containerDefinitions[].environment[] | select(.name=="MYSQL_PASSWORD") | .value) = $p' \
            $TASK_DEFINITION > td.json
          mv td.json $TASK_DEFINITION

      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true